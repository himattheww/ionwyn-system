<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beranda</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/design/system.css" />
    <link rel="stylesheet" href="/styles/beranda.css" />
    <link rel="stylesheet" href="/styles/voice.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <div>
          <p class="eyebrow" id="dateline">Memuat…</p>
          <h1>Hari ini</h1>
        </div>
        <div class="hero-side">
          <svg class="sun" id="sun" viewBox="0 0 170 92" aria-hidden="true">
            <path class="sun-rest" d="M 12 84 A 73 73 0 0 1 158 84" pathLength="100" />
            <path class="sun-done" d="M 12 84 A 73 73 0 0 1 158 84" pathLength="100" />
            <line x1="4" y1="84" x2="166" y2="84" />
            <circle class="sun-dot" r="4" />
            <text class="sun-time" text-anchor="middle"></text>
          </svg>
          <button class="btn" id="refresh" type="button">Muat ulang</button>
        </div>
      </header>

      <section class="strip" id="strip" aria-label="Angka utama"></section>

      <div class="columns">
        <div class="column" id="left"></div>
        <div class="column" id="right"></div>
      </div>

      <section class="links">
        <div class="section-title">
          <h2>Hubungan antar-aplikasi</h2>
          <button class="btn btn-primary aside" id="run" type="button">Jalankan sekarang</button>
        </div>
        <table class="ledger">
          <thead>
            <tr><th>Hubungan</th><th>Terakhir jalan</th><th>Hasil</th></tr>
          </thead>
          <tbody id="integrations"></tbody>
        </table>
      </section>
    </main>

    <button class="voice-fab" id="voice-open" type="button" aria-label="Perintah suara" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
    </button>

    <dialog class="voice-sheet" id="voice-sheet" aria-labelledby="voice-title">
      <form class="voice-form" id="voice-form" novalidate>
        <header class="voice-head">
          <h2 id="voice-title">Perintah</h2>
          <button class="voice-close" id="voice-close" type="button" aria-label="Tutup">&times;</button>
        </header>
        <label class="field">
          <span>Ucapkan atau ketik</span>
          <span class="voice-row">
            <input id="voice-text" type="text" maxlength="300" autocomplete="off" placeholder="makan 25 ribu dari Utama" />
            <button class="voice-mic" id="voice-mic" type="button" aria-label="Bicara" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
            </button>
          </span>
        </label>
        <p class="voice-status" id="voice-status" role="status" aria-live="polite"></p>
        <div class="voice-confirm" id="voice-confirm" hidden>
          <p id="voice-summary"></p>
          <div class="voice-actions">
            <button class="btn btn-primary" id="voice-save" type="button">Simpan</button>
            <button class="btn" id="voice-cancel" type="button">Batal</button>
          </div>
        </div>
        <button class="btn" type="submit">Pahami perintah</button>
        <p class="voice-hint" id="voice-hint"></p>
        <a class="voice-manual" href="/catat/">Catat manual</a>
      </form>
    </dialog>
    <script type="module" src="/lib/beranda.js"></script>
  </body>
</html>
