<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beranda</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/design/system.css" />
    <link rel="stylesheet" href="/styles/beranda.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <div>
          <p class="eyebrow" id="dateline">Memuat…</p>
          <h1>Hari ini</h1>
        </div>
        <div class="hero-side">
          <svg class="sun" id="sun" viewBox="0 0 170 92" aria-hidden="true">
            <path class="sun-rest" d="M 12 84 A 73 73 0 0 1 158 84" pathLength="100" />
            <path class="sun-done" d="M 12 84 A 73 73 0 0 1 158 84" pathLength="100" />
            <line x1="4" y1="84" x2="166" y2="84" />
            <circle class="sun-dot" r="4" />
            <text class="sun-time" text-anchor="middle"></text>
          </svg>
          <button class="btn" id="refresh" type="button">Muat ulang</button>
        </div>
      </header>

      <section class="strip" id="strip" aria-label="Angka utama"></section>

      <div class="columns">
        <div class="column" id="left"></div>
        <div class="column" id="right"></div>
      </div>

      <section class="links">
        <div class="section-title">
          <h2>Hubungan antar-aplikasi</h2>
          <button class="btn btn-primary aside" id="run" type="button">Jalankan sekarang</button>
        </div>
        <table class="ledger">
          <thead>
            <tr><th>Hubungan</th><th>Terakhir jalan</th><th>Hasil</th></tr>
          </thead>
          <tbody id="integrations"></tbody>
        </table>
      </section>
    </main>
    <script type="module" src="/lib/beranda.js"></script>
  </body>
</html>
